[package]
name = "bob-the-butler"
version = "0.2.0"
description = "Bob the Butler USB companion"
authors = ["Bob the Butler contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
uuid = { version = "1", features = ["v4"] }
